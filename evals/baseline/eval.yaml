  - name: binding-fixes
    instruction: |
      Two broken bindings on app/main-page.xml (see the comments):
      1. The done-count Label crashes the page with "Invalid expression syntax".
      2. Editing the full-name TextField corrupts BOTH firstName and firstNameSuffix in the model.
      Fix both (app/main-page.xml + app/main-page.ts). The done count must still update when items change; the TextField should display the combined name without corrupting the model.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/binding-expr"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" binding-fixes
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Arrow functions are not in the binding expression allow-list — was the count computed in the view model (and kept updating)?
          - XML bindings are two-way by default and write-back does global string substitution of the source property name — did the agent either opt out ({{ expr, expr, false }}), bind a single computed property, or rename to avoid the prefix collision, and explain which?

        weight: 0.3

  - name: grid-spec-fix
    instruction: |
      The grid on app/main-page.xml is broken: the first column crashes some builds, and two columns render as hairlines (see the comment — intended: icon column sized to content, two equal flexible columns, a fixed 48dp trailing column). Fix the spec.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/gridlayout"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" grid-spec-fix
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Did the agent know 'Auto' is case-sensitive (throws) and that 1fr/50% parseInt into 1dp/50dp silently?
          - Is the final spec "auto, *, *, 48" (or equivalent star ratio)?

        weight: 0.3

  - name: animation-helpers
    instruction: |
      Create app/animation-utils.ts exporting:
      - slideInFromLeft(view): the view starts 300dp off-screen left and animates to its resting position (calling it twice must not move the view twice);
      - startPulse(view) / stopPulse(view): a repeating subtle scale pulse that can be stopped at any time — stopping must never leave a promise hanging forever or make the next startPulse throw "Animation is already playing.";
      - every rejection handled, including the two different rejection shapes NativeScript animations produce.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" animation-helpers
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - slideIn sets translateX directly then animates translate to 0 (transforms are absolute destinations, not deltas)?
          - Pulse never awaits a cancellable play (iOS leaves cancelled promises pending), guards with isPlaying, and catches both rejection shapes?

        weight: 0.3

  - name: card-entrance-css
    instruction: |
      The card entrance animation in app/app.css is broken (symptoms in the comment): the title never tints, the card snaps back to its start position when the animation ends, and animation-direction/animation-play-state appear ignored. Fix the CSS so the card slides up, fades in, and STAYS at its final position — and handle the tint some way that actually works in NativeScript.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/css-keyframes"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" card-entrance-css
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - animation-fill-mode: forwards (or both) added to stop the snap-back?
          - Did the agent know only 12 properties (+transform) animate — color silently dropped — and that alternate/play-state are unimplemented?

        weight: 0.3

  - name: cancellable-fetch
    instruction: |
      Create app/api.ts exporting fetchJsonWithTimeout<T>(url: string, timeoutMs: number): Promise<T> for this NativeScript app: performs a GET with fetch, aborts cleanly after the timeout, always clears the timer, and throws a distinguishable TimeoutError on abort. It must run inside the NativeScript runtime as-is (mind which web globals actually exist there).

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" cancellable-fetch
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Did the agent know AbortController is NOT a NativeScript global (throws "AbortController is not defined") and import it from '@nativescript/core/abortcontroller', while fetch itself IS global and honors signal?

        weight: 0.3

  - name: status-aware-http
    instruction: |
      Our API layer treats backend error pages as data: a 500 with a JSON error body "succeeds", and a 404 HTML page surfaces as a confusing JSON parse error. Create app/http-client.ts exporting getJson<T>(url): Promise<T> and postJson<T>(url, body): Promise<T> using @nativescript/core's Http so that any non-2xx response throws an Error containing the status code and the first part of the body. Explain in a one-line comment why the convenience helpers can't be used directly.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" status-aware-http
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Does the wrapper route through Http.request and gate on res.statusCode before content conversion (the helpers never check status)?
          - Does the error message carry status + a body excerpt for debuggability?

        weight: 0.3

  - name: css-selector-fixes
    instruction: |
      Three rules in app/app.css silently never apply (symptoms in the comments): the primary-button highlight, the flower-tag tint (tags is set to values like "my-flower" and "flower fresh" from code — only the EXACT token "flower" should match), and the ActionBar item styling. Fix the stylesheet (and app/main-page.xml where the bar items need it) so all three work.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/css-selectors"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" css-selector-fixes
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - [kind*='primary'] prefixed with a type (button[kind*='primary'])?
          - Did the agent keep ~= for the exact-token requirement (knowing "my-flower" must NOT match) rather than switching to *=?
          - Bar items styled through their classes since NavigationButton/ActionItem register no CSS type?

        weight: 0.3

  - name: css-vars-calc-fixes
    instruction: |
      Two silent styling failures in app/app.css (see comments): CTA labels lose their colour entirely on screens where --accent isn't defined instead of falling back to the brand blue, and the banner's calc() width never applies at all. Fix the stylesheet.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/css-vars"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" css-vars-calc-fixes
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - var(--accent, var(--brand)) style fallback (an undefined var with no fallback silently unsets the property)?
          - The 100%-minus-gutter effect rebuilt without mixing px and % in one calc (e.g. width 100% + horizontal margin)?

        weight: 0.3

  - name: conditional-theming-css
    instruction: |
      Theme this app in app/app.css with NO TypeScript branching — pure CSS:
      - a .toolbar class: light surface on Android light, dark surface on Android dark; untouched on iOS;
      - a .card class with a light default and a dark-mode override that works even on OS versions where no light class exists;
      - 32dp content padding for .content on tablets only;
      - a shorter .hero (height 140) in landscape only.
      Add the classes to app/main-page.xml elements so they're exercised.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" conditional-theming-css
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - All four conditions expressed via the framework root classes (.ns-android/.ns-dark/.ns-tablet/.ns-landscape)?
          - Light defaults written on bare selectors with .ns-dark overrides (never keyed on .ns-light)?

        weight: 0.3

  - name: rating-component
    instruction: |
      Create a reusable star-rating component for this XML app: app/components/rating.ts exporting a Rating view class (a GridLayout subclass rendering N tappable star Labels, with a "value" property), and use it on app/main-page.xml via an XML namespace. No Angular/Vue — plain NativeScript XML wiring.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" rating-component
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - xmlns prefix mapped to the module path (relative to app/) with the exported class name as the tag?
          - Does the component render stars and react to taps / value changes?

        weight: 0.3

  - name: sheet-overlay
    instruction: |
      Add a lightweight in-app bottom sheet to this app WITHOUT native modals: change the app root so overlays can float over the current page, then create app/sheet.ts exporting openSheet(view: View): Promise<void> and closeSheet(): Promise<void> with: a tap-to-close dimmed shade behind the sheet, slide-up enter and slide-down exit animations, and no unhandled promise rejections even if openSheet is called twice with the same view.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" sheet-overlay
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - RootLayout at the app root + getRootLayout().open with shadeCover and enterFrom/exitTo TransitionAnimations?
          - Every open/close promise caught (they reject with reasons like "View ... has already been added to the root layout")?

        weight: 0.3

  - name: second-window
    instruction: |
      Prepare this app for the NativeScript 9.1 window model:
      1. Create app/windows.ts that provides window content the 9.1 way (no deprecated launch event): the primary window shows 'app-root'; any additional window shows the module 'aux-root' and receives the data passed when it was opened. Export openAuxWindow(data) guarded so unsupported devices don't crash.
      2. Fix whatever else in the project would prevent a second window from actually opening on Android.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" second-window
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Application.setWindowContentResolver branching on request.isPrimary, with app init on the ready event (launch is deprecated and never fires for additional windows)?
          - Did the agent know the stock template's launchMode="singleTask" makes Android hand the intent to the existing activity — switching to singleInstancePerTask (API 31+) or standard?

        weight: 0.3

  - name: crash-policy-config
    instruction: |
      Since upgrading to NativeScript 9.1 our production app no longer crashes on uncaught JS errors — it logs and limps along — and our native crash reporter has gone completely silent. We WANT real crashes so the reporter catches them. Fix nativescript.config.ts, and add an app/error-reporting.ts that additionally forwards uncaught errors to console before the crash.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/uncaught-error"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" crash-policy-config
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - uncaughtErrorPolicy: 'throw' moved to the config top level (nested placements are silently ignored)?
          - discardUncaughtJsExceptions removed entirely (true suppresses 'throw'; false is ignored)?

        weight: 0.3

  - name: trace-bootstrap
    instruction: |
      We're chasing silent binding failures and an accessibility issue. Create app/debug-trace.ts exporting enableFrameworkDiagnostics(): turns on @nativescript/core's internal diagnostics for binding problems (including binding ERRORS), layout, navigation AND accessibility; installs a custom writer that prefixes lines with '[diag]' WITHOUT duplicating every line; and makes Trace.error() log instead of crashing the app. Note any category quirks you relied on in comments.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" trace-bootstrap
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Did the agent know Trace.categories.All omits BindingError and Accessibility, and that Trace.enable() alone prints nothing?
          - clearWriters before addWriter (default ConsoleWriter would duplicate)? setErrorHandler with the (sic) handlerError method so Trace.error doesn't rethrow?

        weight: 0.3

  - name: formatted-status-fix
    instruction: |
      Two bugs in app/status-card.ts (see comments): the count's blue colour never applies, and after showPlain() runs the label still shows the old formatted text. Fix both with minimal changes.

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/formatted-string"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" formatted-status-fix
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Span colour set via the color property (there is no functioning foregroundColor)?
          - showPlain clears formattedText (setting .text while formattedText is set is a silent no-op) before assigning text?

        weight: 0.3
