          - Does the code avoid handing live JS arrays to indexSearchableItems (ArrayAdapter + dispatch_apply = V8 isolate deadlock)? Materializing into NSMutableArray/NSArray on the JS thread is the required move, including the nested keywords array on the attribute set.
          - Are further native calls inside CoreSpotlight completion handlers deferred via Utils.dispatchToMainThread?
          - Is expirationDate set to NSDate.distantFuture?

