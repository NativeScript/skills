# GENERATED by evals/build.mjs from evals/tasks.mjs — do not edit.
# Run with evals/run.sh (sets SKILLGRADE_REPO and uses the local provider).
# Baseline: identical tasks with NO skills installed, to measure uplift.
version: "1"
skill: ./empty

defaults:
  agent: command
  command: bash "$SKILLGRADE_REPO/evals/agent/claude-cli.sh"
  provider: local
  trials: 3
  timeout: 900
  threshold: 0.7
  grader_provider: anthropic

tasks:
  - name: android-edge-to-edge
    instruction: |
      On Android 15 (API 35) this app's bottom TabView strip looks wrong: the bar's surface colour stops at a hard line and the page canvas colour fills the gesture-nav strip below it. Separately, compose-page's docked bottom bar (the "Attach / Send" row) sits underneath the gesture pill.

      Fix both without adding any plugin:
      1. Make the tab bar's colour run seamlessly to the physical bottom edge (app/app-root.xml and app/shell-page.xml). Headers must stay clear of the status bar.
      2. Implement onRootLoaded in app/compose-page.ts so the docked bottom bar clears the gesture-nav area (adjust app/compose-page.xml if needed).

    workspace:
      - src: "../../evals/fixtures/ns-app-ts"
        dest: "."
      - src: "../../evals/fixtures/edge-to-edge"
        dest: "."
    graders:
      - type: deterministic
        run: node "$SKILLGRADE_REPO/evals/graders/check.mjs" android-edge-to-edge
        weight: 0.7
      - type: llm_rubric
        rubric: |
          - Did the agent put androidOverflowEdge="bottom" (skip-bottom semantics) on the ROOT and the shell wrapper, rather than inverted values like all-but-bottom or none?
          - Did compose-page read insets directly off the window (WindowMetrics or getRootWindowInsets) instead of waiting for an androidOverflowInset event that never fires on page layouts?
          - Is only the stable navigation inset padded (not the IME inset)?

        weight: 0.3

  - name: android-modal-insets
    instruction: |
      The settings modal (app/settings-modal.xml, opened from main-page with fullscreen: true) renders horribly on Android only: every Label's box is ~50dp taller than its text, there are big phantom gaps between stacked labels, the emoji glyphs get pushed out of view, and content collides with the status bar. The identical markup is perfect on iOS and in the main window.

      Fix it properly: create app/modal-insets.ts exporting a reusable helper that configures the modal correctly from its loaded event, wire it up in app/settings-modal.ts, and add any attribute needed in app/settings-modal.xml. The modal's own padding already keeps content away from the screen edges, so nothing inside needs edge-anchoring.

    workspace:
